name: NearShare Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag to Build (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

jobs:
  build-macos:
    name: Build macOS Release (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release Version & Git Tag
        run: |
          TAG_VALUE="${{ github.ref_name || inputs.version_tag || 'v0.1.0' }}"
          npm run validate:version "$TAG_VALUE"

      - name: Scan for Accidental Secrets
        run: npm run check:secrets

      - name: Run Test Suite
        run: npm test

      - name: Run Linter
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.0 --locked || true

      # -----------------------------------------------------------------
      # Code Signing Scaffolding (macOS Apple Developer ID & Notarization)
      # When secrets are configured, set:
      #   APPLE_CERTIFICATE: Base64-encoded Developer ID Application .p12
      #   APPLE_CERTIFICATE_PASSWORD: Password for the .p12 certificate
      #   APPLE_SIGNING_IDENTITY: "Developer ID Application: Team Name (TEAMID)"
      #   APPLE_ID: Apple ID email
      #   APPLE_PASSWORD: App-specific password
      #   APPLE_TEAM_ID: 10-character Team ID
      # -----------------------------------------------------------------
      - name: Build macOS Application Bundle (.app & .dmg)
        run: cargo tauri build
        env:
          # Scaffolding: Enabled automatically when secrets are present in repository
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate macOS Release Artifact Manifest & SHA-256 Checksums
        run: node scripts/generate-release-manifest.mjs src-tauri/target/release/bundle macos-release-manifest.json

      - name: Verify macOS Release Artifact Hashes
        run: node scripts/verify-release-manifest.mjs macos-release-manifest.json src-tauri/target/release/bundle

      - name: Upload macOS Release Manifest
        uses: actions/upload-artifact@v4
        with:
          name: nearshare-macos-manifest
          path: macos-release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS Disk Image (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: nearshare-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Compress & Upload macOS Application (.app)
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf NearShare-app-macos-aarch64.tar.gz NearShare.app

      - name: Upload macOS App Archive
        uses: actions/upload-artifact@v4
        with:
          name: nearshare-macos-app
          path: src-tauri/target/release/bundle/macos/NearShare-app-macos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows Release (x64 NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release Version & Git Tag
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) { $tag = "${{ inputs.version_tag }}" }
          if (-not $tag) { $tag = "v0.1.0" }
          npx tsx scripts/validate-version.ts "$tag"

      - name: Scan for Accidental Secrets
        run: npm run check:secrets

      - name: Run Test Suite
        run: npm test

      - name: Run Linter
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.0 --locked
        shell: bash

      # -----------------------------------------------------------------
      # Code Signing Scaffolding (Windows Authenticode)
      # When secrets are configured, set:
      #   WINDOWS_CERTIFICATE: Base64-encoded .pfx certificate
      #   WINDOWS_CERTIFICATE_PASSWORD: Password for the .pfx certificate
      # -----------------------------------------------------------------
      - name: Build Windows NSIS Installer (.exe)
        run: cargo tauri build --bundles nsis
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Generate Windows Release Artifact Manifest & SHA-256 Checksums
        run: node scripts/generate-release-manifest.mjs src-tauri/target/release/bundle windows-release-manifest.json

      - name: Verify Windows Release Artifact Hashes
        run: node scripts/verify-release-manifest.mjs windows-release-manifest.json src-tauri/target/release/bundle

      - name: Upload Windows Release Manifest
        uses: actions/upload-artifact@v4
        with:
          name: nearshare-windows-manifest
          path: windows-release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: nearshare-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

